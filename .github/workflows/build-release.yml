name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
      - name: Isolated TUN and routing integration
        run: |
          # Run the user namespace test as root on runners that restrict unprivileged user namespaces.
          sudo env PATH="$PATH" GOTOOLCHAIN=local bash tests/netns.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/happ ./cmd/happ
          cd dist
          tar czf happ-${GOOS}-${GOARCH}.tar.gz happ
          sha256sum *.tar.gz > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: happ-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: cat artifacts/*/checksums.txt > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'dev') || contains(github.ref, 'beta') }}
          files: |
            artifacts/*/*.tar.gz
            checksums.txt
